name = "maguru-auto-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
APP_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "maguru_auto"
database_id = "local"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "maguru-auto-media"

[dev]
port = 8787
local_protocol = "http"
